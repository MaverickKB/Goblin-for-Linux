name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the engine and frontend suites
        run: python scripts/check.py

  build:
    name: Release build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev \
            libasound2-dev libsecret-1-dev libsecret-tools patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch the bundled CPython
        run: bash scripts/fetch-python.sh
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build the release binary
        run: npm run tauri build -- --no-bundle
      - name: Check the packaged frontend is current
        run: test -f src-tauri/target/release/goblin
